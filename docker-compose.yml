version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: auto_atc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atc_password}
      POSTGRES_DB: ${POSTGRES_DB:-atc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atc_user} -d ${POSTGRES_DB:-atc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

